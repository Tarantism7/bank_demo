databaseChangeLog:
  - changeSet:
      id: create-transfers
      author: developer
      changes:
        - createTable:
            tableName: transfer
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: from_card_id
                  type: BIGINT
              - column:
                  name: to_card_id
                  type: BIGINT
              - column:
                  name: amount
                  type: DECIMAL(15,2)
              - column:
                  name: created_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            constraintName: fk_transfer_from_card
            baseTableName: transfer
            baseColumnNames: from_card_id
            referencedTableName: cards
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_transfer_to_card
            baseTableName: transfer
            baseColumnNames: to_card_id
            referencedTableName: cards
            referencedColumnNames: id