<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Bank Demo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Navigation Header -->
<nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold">Bank Demo Dashboard</h1>
    <div class="flex items-center space-x-4">
        <span>Welcome, <strong th:text="${user.username}">John Doe</strong>!</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="bg-blue-700 hover:bg-blue-800 text-sm px-3 py-1.5 rounded transition">
                Logout
            </button>
        </form>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-6xl mx-auto mt-8 p-4 grid grid-cols-1 md:grid-cols-3 gap-6">

    <div class="md:col-span-3" th:if="${successMessage}">
        <p class="bg-green-100 text-green-800 p-3 rounded" th:text="${successMessage}"></p>
    </div>
    <div class="md:col-span-3" th:if="${errorMessage}">
        <p class="bg-red-100 text-red-800 p-3 rounded" th:text="${errorMessage}"></p>
    </div>

    <!-- Cards -->
    <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-sm font-semibold text-gray-500 uppercase">My Cards</h2>
        <div th:each="c : ${cards}" class="mt-3 border-b pb-2">
            <p class="text-xs text-gray-400">Card #<span th:text="${c.id}">1</span> · <span th:text="${c.status}">ACTIVE</span></p>
            <p class="text-xl font-bold text-blue-600" th:text="${#numbers.formatDecimal(c.balance, 1, 'COMMA', 2, 'POINT')}">0.00</p>
        </div>
        <p th:if="${#lists.isEmpty(cards)}" class="text-gray-500 mt-2">No cards yet.</p>
    </section>

    <!-- Transfer -->
    <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 md:col-span-2">
        <h2 class="text-lg font-bold mb-4">Quick Money Transfer</h2>
        <form th:action="@{/user/transfer}" method="post" class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <select name="fromCardId" required class="border border-gray-300 rounded p-2 text-sm">
                <option th:each="c : ${cards}" th:value="${c.id}" th:text="'From card #' + ${c.id}"></option>
            </select>
            <input type="number" name="toCardId" required placeholder="To card ID"
                   class="border border-gray-300 rounded p-2 text-sm">
            <input type="number" name="amount" step="0.01" min="0.01" required placeholder="0.00"
                   class="border border-gray-300 rounded p-2 text-sm">
            <button type="submit" class="bg-blue-600 text-white font-semibold py-2 px-4 rounded text-sm">Transfer</button>
        </form>
    </section>

    <!-- Transactions -->
    <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 md:col-span-3">
        <h2 class="text-lg font-bold mb-4">Recent Transactions</h2>
        <table class="w-full text-left">
            <thead>
            <tr class="border-b bg-gray-50 text-xs font-semibold text-gray-500 uppercase">
                <th class="p-3">ID</th><th class="p-3">From</th><th class="p-3">To</th>
                <th class="p-3">Amount</th><th class="p-3">Date</th>
            </tr>
            </thead>
            <tbody class="text-sm divide-y">
            <tr th:each="tx : ${transactions}">
                <td class="p-3" th:text="${tx.id}"></td>
                <td class="p-3" th:text="${tx.fromCard.id}"></td>
                <td class="p-3" th:text="${tx.toCard.id}"></td>
                <td class="p-3 font-semibold" th:text="${tx.amount}"></td>
                <td class="p-3 text-gray-500" th:text="${#temporals.format(tx.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="5" class="p-4 text-center text-gray-500">No transactions found.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
