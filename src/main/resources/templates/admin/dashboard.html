<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bank Demo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

<!-- Admin Topbar -->
<nav class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center space-x-2">
        <span>🛡️ System Administration</span>
    </h1>
    <div class="flex items-center space-x-4">
        <span class="text-sm text-slate-300">Logged in as Admin</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-sm px-3 py-1.5 rounded transition">
                Logout
            </button>
        </form>
    </div>
</nav>

<!-- Main Container -->
<main class="max-w-7xl mx-auto mt-8 p-4">

    <!-- System Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-blue-500">
            <p class="text-xs font-semibold text-gray-500 uppercase">Total Users</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" th:text="${totalUsers}">1,240</p>
        </div>
        <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-green-500">
            <p class="text-xs font-semibold text-gray-500 uppercase">System Liquidity</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" th:text="${#numbers.formatCurrency(totalLiquidity)}">$4,850,000.00</p>
        </div>
        <div class="bg-white p-5 rounded-lg border border-gray-200 shadow-sm border-l-4 border-l-amber-500">
            <p class="text-xs font-semibold text-gray-500 uppercase">Active Credit Cards</p>
            <p class="text-3xl font-bold text-gray-800 mt-1" th:text="${activeCards}">892</p>
        </div>
    </div>

    <!-- User Management Table -->
    <div th:if="${successMessage}" class="mb-4 bg-green-100 text-green-800 p-3 rounded" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="mb-4 bg-red-100 text-red-800 p-3 rounded" th:text="${errorMessage}"></div>

    <section class="bg-white rounded-lg border border-gray-200 shadow-sm p-6">
        <h2 class="text-lg font-bold mb-4">Users</h2>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="border-b bg-slate-50 text-xs font-semibold text-gray-500 uppercase">
                    <th class="p-3">ID</th>
                    <th class="p-3">Username</th>
                    <th class="p-3">Email</th>
                    <th class="p-3">Role</th>
                    <th class="p-3 text-right">Actions</th>
                </tr>
                </thead>
                <tbody class="text-sm divide-y">
                <tr th:each="u : ${users}">
                    <td class="p-3 font-mono text-xs" th:text="${u.id}">1</td>
                    <td class="p-3 font-semibold" th:text="${u.username}">user1</td>
                    <td class="p-3 text-gray-600" th:text="${u.email}">user@example.com</td>
                    <td class="p-3" th:text="${u.role}">USER</td>
                    <td class="p-3 text-right">
                        <form th:action="@{/admin/users/delete/{id}(id=${u.id})}" method="post" class="inline">
                            <button type="submit" onclick="return confirm('Are you sure?');"
                                    class="text-red-600 hover:underline text-xs">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

</body>
</html>
